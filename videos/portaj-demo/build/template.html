<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Portaj demo</title>
    <!-- GENERATED by build/build.py from build/template.html + build/sub/*.html + build/plan.json. Edit those, then rebuild. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f6f4ef; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f4ef; }
      #ground { position: absolute; inset: 0; background: #f6f4ef; }

      /* Footage: the real site, full-bleed. One camera rig moves the landing and every take segment together. */
      #stage { position: absolute; inset: 0; overflow: hidden; }
      #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .seg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; background: #fff; }
      .slot { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1920" data-height="1080">
      <div id="ground" class="clip" data-start="0" data-duration="{{TOTAL}}" data-track-index="0"></div>

      <div id="stage">
        <div id="cam" data-layout-allow-overflow>
          <div id="el-landing" class="slot" data-composition-id="landing" data-composition-src="compositions/landing.html" data-start="{{LANDING_START}}" data-duration="{{LANDING_DUR}}" data-track-index="1" data-width="1920" data-height="1080"></div>
{{VIDEOS}}
        </div>
      </div>

      <div id="el-title-card" class="slot" data-composition-id="title-card" data-composition-src="compositions/title-card.html" data-start="0" data-duration="{{SCREEN_START_PLUS}}" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div id="el-end-card" class="slot" data-composition-id="end-card" data-composition-src="compositions/end-card.html" data-start="{{END_START}}" data-duration="{{END_DUR}}" data-track-index="4" data-width="1920" data-height="1080"></div>

{{MUSIC}}
{{VO}}
{{SFX}}
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const CAM = {{CAMERA}};
      // Camera: one rig, keyframed in output pixels (computed in build.py from page coordinates).
      gsap.set("#cam", { transformOrigin: "0 0" });
      tl.set("#cam", { x: CAM[0].x, y: CAM[0].y, scale: CAM[0].scale }, 0);
      for (let i = 1; i < CAM.length; i++) {
        const c = CAM[i];
        tl.to("#cam", { x: c.x, y: c.y, scale: c.scale, duration: c.dur, ease: c.ease }, c.at);
      }
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
